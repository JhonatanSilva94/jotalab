server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Não expõe a versão do nginx nos headers/páginas de erro
    server_tokens off;

    # Compressão para os arquivos de texto (imagens webp já são comprimidas)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Headers básicos de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Gateway: /api/products[/...] -> service-products:8080/products[/...]
    # (o prefixo /api é removido). ^~ impede que as regex abaixo
    # (ex.: \.json$) capturem rotas da API.
    location = /api/products {
        proxy_pass http://service-products:8080/products;
    }

    location ^~ /api/products/ {
        proxy_pass http://service-products:8080/products/;
    }

    # Gateway: /api/users e /api/login -> service-login:8080 (sem o prefixo /api)
    location = /api/users {
        proxy_pass http://service-login:8080/users;
    }

    location = /api/login {
        proxy_pass http://service-login:8080/login;
    }

    # Gateway: carrinho e pedidos (exigem JWT; o header Authorization é repassado).
    # Só /cart e /cart/items são expostos: /internal/... do cart, o inventory
    # e o payments NÃO têm rota aqui e ficam só na rede interna do Compose.
    location = /api/cart {
        proxy_pass http://service-cart:8080/cart;
    }

    location ^~ /api/cart/items {
        proxy_pass http://service-cart:8080/cart/items;
    }

    location = /api/orders {
        proxy_pass http://service-orders:8080/orders;
    }

    location ^~ /api/orders/ {
        proxy_pass http://service-orders:8080/orders/;
    }

    # HTML, JS, CSS e JSON mudam a cada deploy: o navegador sempre revalida
    location ~* \.(html|js|css|json)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Imagens podem ficar em cache por 7 dias
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
